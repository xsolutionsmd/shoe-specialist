worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/site;
        # Indexing stays disabled for production and both previews until owner approval.
        # Locations that add a cache header repeat robots: nginx does not inherit add_header there.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;

        location = /version.json {
            try_files $uri =404;
            default_type application/json;
            etag off;
            if_modified_since off;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /health {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 200 "ok\n";
        }
        location = / {
            try_files /index.html =404;
        }
        location = /index.html {
            try_files $uri =404;
        }
        location = /favicon.svg {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location ~ (^|/)\. {
            return 404;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location /textures/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        # This site uses section anchors, not client-side routes. Never return HTML for
        # missing assets or source/private paths (including the base image's stock pages).
        location / {
            return 404;
        }
    }
}
